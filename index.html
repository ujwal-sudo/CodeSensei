<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeSensei — Intelligent Code Architecture OS</title>
  <meta name="description"
    content="Feed it a repo. Get a complete architectural brain map, risk assessment, and execution simulation." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>

  <!-- Fallback Error Display -->
  <script>
    window.onerror = function (msg, url, line) {
      if (msg.includes('ResizeObserver')) return;

      const root = document.getElementById('root');
      if (root && root.childNodes.length === 0) {
        document.body.innerHTML = `
             <div style="display:flex; height:100vh; align-items:center; justify-content:center; flex-direction:column; text-align:center; font-family:'DM Sans',sans-serif; background:#080810; color:#FF3B5C;">
               <h2 style="font-size:2rem; margin-bottom:1rem; font-family:'Syne',sans-serif;">System Malfunction</h2>
               <p style="color:#8B8BA0; max-width:500px; margin-bottom:2rem;">
                 The React application failed to mount. <br/>
                 1. Ensure you are running the Frontend Development Server (e.g. Vite), not just the Backend.<br/>
                 2. Check the browser console for import errors.
               </p>
               <div style="background:#0E0E1A; padding:1rem; border-radius:12px; text-align:left; font-family:'JetBrains Mono',monospace; color:#F0EFFF; font-size:0.8rem; border:1px solid #1E1E35;">
                 Error: ${msg}
               </div>
             </div>
           `;
      }
    };
  </script>
</body>

</html>
